<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Parqueo - Torre Granados</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div id="loginCard" class="login-wrapper">
        <div class="card-center" style="background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(10px);">
            <img src="logotorre.png" class="logo-large" alt="Logo">
            
            <div class="input-field">
                <label for="loginUser">Usuario</label>
                <input type="text" id="loginUser" placeholder="Ingresa tu usuario">
            </div>
            
            <div class="input-field">
                <label for="loginPass">Contraseña</label>
                <input type="password" id="loginPass" placeholder="Ingresa tu contraseña">
            </div>
            
            <div style="text-align: left; margin: 15px 5px; color: #8e8e93; font-size: 14px;">
                <input type="checkbox" id="rememberMe"> <label for="rememberMe" style="display:inline; text-transform:none; font-weight:normal;">Recordar usuario</label>
            </div>
            
            <button class="ios-btn btn-large" onclick="login()">Ingresar al Sistema</button>
        </div>
    </div>

    <div id="appCard" class="app-container" style="display:none;">
        
        <div class="header-logo-container">
            <img src="logotorre.png" class="logo-app-main" alt="Logo">
        </div>

        <div class="reloj-viva">
            <div id="reloj">00:00:00</div>
            <div id="fecha">Fecha Cargando...</div>
        </div>

        <div class="card center-content">
            <h3 class="title-ios-sub">Ingreso de Vehículo</h3>
            <input type="text" id="plateInput" class="input-plate" placeholder="PLACA" style="text-transform: uppercase; margin-bottom: 15px;">
            <button class="ios-btn btn-large" onclick="registrarEntrada()">INGRESAR VEHÍCULO</button>
        </div>

        <div class="card">
            <h3 class="title-ios-green">Vehículos en el Parqueo</h3>
            <div id="activeList"></div>
        </div>

        <div class="card center-content">
            <h3 class="title-ios-sub">Otros Servicios</h3>
            <div class="button-row" style="margin-bottom: 10px;">
                <button class="ios-btn-alt btn-med" onclick="cobrarTicketPerdido()">🎫 Ticket Perdido (Q25)</button>
                <button class="ios-btn-alt btn-med" onclick="cobrarBaño()">🧻 Uso de Baño (Q3)</button>
            </div>
            <button class="ios-btn-alt btn-large" style="width:100%;" onclick="abrirModalMensual()">📅 Cobrar Mensualidad</button>
        </div>

        <div class="card center-content">
            <button class="ios-btn-report" style="width:100%; margin-bottom:10px;" onclick="toggleHistorial()">📋 Ver Movimientos del Turno</button>
            <div id="historialBox" class="historial-container" style="display:none; color:#000;"></div>
            
            <button class="ios-btn-report" style="width:100%; background:#0265f0;" onclick="generarReporteHTML()">🖨️ Generar Reporte General</button>
        </div>

        <div class="footer-user-fixed">
            <span id="userDisplay">👤 OPERADOR: CARGANDO...</span>
        </div>
    </div>

    <!-- ========================================================================== -->
    <!-- MODALES DE CONTROL -->
    <!-- ========================================================================== -->

    <!-- 1. MODAL MENSUALIDAD -->
    <div id="modalMensual" class="card center-content" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; width: 90%; max-width: 400px; border: 1px solid #333; background: rgba(20, 20, 20, 0.95);">
        <h3 class="title-ios-sub">Registrar Pago Mensual</h3>
        <div class="input-field">
            <label style="color:#fff;">Nombre del Cliente</label>
            <input type="text" id="mNombre" placeholder="Cliente o Empresa" style="background:#fff; color:#000;">
        </div>
        <div class="input-field">
            <label style="color:#fff;">Monto Recibido</label>
            <input type="number" id="mCosto" placeholder="Monto en Q" style="background:#fff; color:#000;">
        </div>
        <div class="button-row" style="margin-top:20px;">
            <button class="ios-btn-danger" style="background:#555; margin:0;" onclick="cerrarModalMensual()">Cancelar</button>
            <button class="ios-btn" style="flex:1; border-radius:10px;" onclick="guardarMensualidad()">Guardar</button>
        </div>
    </div>

    <!-- 2. MODAL TICKET PERDIDO -->
    <div id="modalTicketPerdido" class="card center-content" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; width: 90%; max-width: 400px; border: 1px solid #333; background: rgba(20, 20, 20, 0.95);">
        <h3 class="title-ios-sub">Reposición Ticket Perdido</h3>
        <p style="color: #8e8e93; font-size: 14px; margin-bottom: 15px;">Ingrese la placa para realizar el cobro de Q25.00</p>
        <div class="input-field">
            <label style="color:#fff;">Número de Placa</label>
            <input type="text" id="tpPlaca" placeholder="M000XXX o P000XXX" style="background:#fff; color:#000; text-transform: uppercase;">
        </div>
        <div class="button-row" style="margin-top:20px;">
            <button class="ios-btn-danger" style="background:#555; margin:0;" onclick="cerrarModalTicketPerdido()">Cancelar</button>
            <button class="ios-btn" style="flex:1; border-radius:10px; background:#ff9500;" onclick="guardarTicketPerdido()">Cobrar Q25</button>
        </div>
    </div>

    <!-- 3. MODAL REPORTE GENERAL -->
    <div id="modalReporte" class="card center-content" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; width: 90%; max-width: 400px; border: 1px solid #333; background: rgba(20, 20, 20, 0.95);">
        <h3 class="title-ios-sub">Cierre de Turno y Caja</h3>
        <div class="input-field" style="margin-bottom: 10px; margin-top: 15px;">
            <label style="color:#fff;">Nombre</label>
            <input type="text" id="repTrabajador" placeholder="Nombre" style="background:#fff; color:#000; text-transform: uppercase;">
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 15px;">
            <button class="ios-btn" style="background: #34c759; border-radius: 10px; margin: 0; padding: 12px;" onclick="procesarReporteAccion('IMPRIMIR')">🖨️ Imprimir Ticket Físico</button>
            <button class="ios-btn" style="background: #007aff; border-radius: 10px; margin: 0; padding: 12px;" onclick="procesarReporteAccion('DESCARGAR')">🖼️ Ver / Compartir Imagen</button>
            <button class="ios-btn-danger" style="background: #555; border-radius: 10px; margin: 5px 0 0 0; padding: 10px;" onclick="cerrarModalReporte()">Cancelar</button>
        </div>
    </div>

    <!-- 4. VISOR DE REPORTE CON BOTÓN DE ACCIÓN COMPARTIR/GUARDAR -->
    <div id="modalVerImagen" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; overflow-y: auto; padding: 20px 10px; box-sizing: border-box; text-align: center;">
        <div style="max-width: 500px; margin: 0 auto; background: #222; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            <h4 style="color:#fff; font-family:sans-serif; margin-top:0; margin-bottom:15px;">Reporte Listo</h4>
            
            <div id="contenedorRenderImagen" style="background:#fff; padding:5px; border-radius:4px; display:inline-block; max-width:100%;"></div>
            
            <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 20px;">
                <button id="btnCompartirNativo" class="ios-btn" style="background:#34c759; margin:0; padding:12px; border-radius:8px; font-weight:bold;">📲 ENVIAR O GUARDAR REPORTE</button>
                <button class="ios-btn-danger" style="background:#555; margin:0; padding:10px; border-radius:8px;" onclick="cerrarModalVerImagen()">Volver</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
