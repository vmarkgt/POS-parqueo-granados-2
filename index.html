<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Parqueo - Torre Granados</title>
    <!-- Enlace obligatorio para que el navegador lo reconozca como App PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Librería para la generación de reportes visuales -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <!-- CARD DE LOGIN -->
    <div id="loginCard" class="card">
        <center><img src="logotorre.png" width="150" alt="Logo"></center>
        <h2>Control de Parqueo</h2>
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <div class="remember-box">
            <input type="checkbox" id="rememberMe"> <label for="rememberMe">Recordar usuario</label>
        </div>
        <button class="ios-btn" onclick="login()">Ingresar al Sistema</button>
    </div>

    <!-- CARD PRINCIPAL DE LA APLICACIÓN -->
    <div id="appCard" class="card" style="display:none;">
        <div class="header-app">
            <span id="userDisplay">👤 Usuario: </span>
            <div id="reloj-box">
                <div id="reloj">00:00:00</div>
                <div id="fecha">Fecha Cargando...</div>
            </div>
        </div>

        <hr style="border: 0.5px solid #e5e5ea; margin: 15px 0;">

        <!-- REGISTRO DE ENTRADAS -->
        <div class="section">
            <h3>Ingreso de Vehículo</h3>
            <div style="display:flex; gap:10px;">
                <input type="text" id="plateInput" placeholder="INGRESE PLACA (Ej: P123ABC o M123ABC)" style="text-transform: uppercase;">
                <button class="ios-btn-success" onclick="registrarEntrada()">INGRESAR</button>
            </div>
        </div>

        <!-- LISTA DE VEHÍCULOS ACTIVOS -->
        <div class="section">
            <h3>Vehículos en el Parqueo</h3>
            <div id="activeList" class="lista-vehiculos">
                <!-- Se llena dinámicamente mediante JS -->
            </div>
        </div>

        <!-- MÓDULO DE SERVICIOS EXTRAS -->
        <div class="section">
            <h3>Otros Servicios y Cobros</h3>
            <div class="grid-servicios">
                <button class="btn-servicio perdido" onclick="cobrarTicketPerdido()">🎫 Ticket Perdido (Q25)</button>
                <button class="btn-servicio baño" onclick="cobrarBaño()">🧻 Uso de Baño (Q3)</button>
                <button class="btn-servicio mensual" onclick="abrirModalMensual()">📅 Cobrar Mensualidad</button>
            </div>
        </div>

        <!-- ACCIONES DE CIERRE Y ADMINISTRACIÓN -->
        <div style="margin-top: 30px; display:flex; flex-direction:column; gap:10px;">
            <button class="ios-btn" style="background:#5856d6;" onclick="toggleHistorial()">📋 Ver Movimientos del Turno</button>
            <div id="historialBox" class="historial-container" style="display:none;"></div>
            <button class="ios-btn" style="background:#007aff;" onclick="generarReporteHTML()">🖨️ Generar Reporte General (Cierre)</button>
        </div>
    </div>

    <!-- MODAL EMERGENTE PARA PAGOS MENSUALES -->
    <div id="modalMensual" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3>Registrar Pago Mensual</h3>
            <input type="text" id="mNombre" placeholder="Nombre del Cliente / Empresa">
            <input type="number" id="mCosto" placeholder="Monto Recibido (Q)">
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="ios-btn" style="background:#8e8e93;" onclick="cerrarModalMensual()">Cancelar</button>
                <button class="ios-btn-success" onclick="guardarMensualidad()">Guardar Pago</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
